spring.application.name=gestiontareas

# Perfil utilizado por defecto
spring.profiles.default=dev

# Desactivar Open Session in View
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Render provides PORT; local development defaults to 8080.
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# Migrations require an explicit opt-in; never baseline an existing database automatically.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=false
demo.session-hours=${DEMO_SESSION_HOURS:24}
demo.max-sessions=${DEMO_MAX_SESSIONS:1000}
demo.max-projects=${DEMO_MAX_PROJECTS:5}
demo.max-tasks=${DEMO_MAX_TASKS:25}
demo.rate-per-minute=${DEMO_RATE_PER_MINUTE:120}
demo.session-rate-per-minute=${DEMO_SESSION_RATE_PER_MINUTE:5}
